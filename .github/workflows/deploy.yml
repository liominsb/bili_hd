name: Deploy Go Backend to Tencent Cloud

# 1. 触发时机：当代码 push 到 main 分支时自动触发
on:
  push:
    branches: [ master, main ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 第一步：把 GitHub 仓库的最新代码拉取到 GitHub 云端构建机上
      - name: Checkout Code
        uses: actions/checkout@v4

      # 第二步：将后端代码通过 SCP 同步到腾讯云服务器
      - name: Copy files to Server via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}          # 换成密钥认证
          port: 22
          source: "."
          target: "/root/gobili/go_bili"

      # 第三步：通过 SSH 远程登录服务器，触发 Docker 重建与无缝重启
      - name: Deploy and Rebuild Docker Container
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}          # 换成密钥认证
          port: 22
          script: |
            cd /root/gobili
            # 利用 Docker 缓存自动重新编译 Go 后端并热重启，其他 MySQL/Redis/Nginx 保持不动
            docker compose -f docker-compose.prod.yml up -d --build server