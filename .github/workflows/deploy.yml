name: Deploy Go Backend to Tencent Cloud

on:
  push:
    branches: [ master, main ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. 检出后端代码
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. 将轻量源码（仅几百 KB，秒级传输）通过 SCP 同步到腾讯云
      - name: Copy files to Server via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          source: "."
          target: "/root/gobili/go_bili"

      # 3. 腾讯云利用机房内网源超高速下载 ffmpeg 并重建启动
      - name: Deploy and Rebuild Docker Container
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          command_timeout: 10m
          script: |
            cd /root/gobili
            docker compose -f docker-compose.prod.yml up -d --build server
